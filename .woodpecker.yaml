# -*- yaml -*-

steps:
  - name: pychecks
    when:
      - event: [manual, pull_request]
      - event: [push, tag]
        branch: [master, releases/*]
    image: alpine:edge
    commands:
      - apk add openssl
      - apk add python3
      - apk add py3-pip
      - python3 -m venv venv
      - source venv/bin/activate
      - python -m pip install --upgrade pip
      - pip install codespell
      - pip install mypy
      - pip install ruff
      - codespell
      - mypy
      - ruff check
      - deactivate

  - name: subprojects
    when:
      - event: [manual, pull_request]
      - event: [push, tag]
        branch: [master, releases/*]
    image: alpine:edge
    commands:
      - apk add git
      - mkdir -p subprojects && cd subprojects
      - git clone https://codeberg.org/dnkl/tllist.git
      - git clone https://codeberg.org/dnkl/fcft.git
      - cd ..

  - name: x64
    when:
      - event: [manual, pull_request]
      - event: [push, tag]
        branch: [master, releases/*]
    depends_on: [subprojects]
    image: alpine:edge
    commands:
      - apk update
      - apk add musl-dev linux-headers meson ninja gcc clang scdoc ncurses
      - apk add libxkbcommon-dev pixman-dev freetype-dev fontconfig-dev harfbuzz-dev utf8proc-dev
      - apk add wayland-dev wayland-protocols
      - apk add git python3 zig
      # The 0.17 series is required (tested with 0.17.1).
      - test "$(zig version | cut -d. -f1,2)" = 0.17
      - apk add check-dev
      - apk add ttf-hack font-noto-emoji

      # Debug
      - mkdir -p bld/debug-x64
      - cd bld/debug-x64
      - meson setup --buildtype=debug -Dgrapheme-clustering=enabled -Dfcft:grapheme-shaping=enabled -Dfcft:run-shaping=enabled -Dfcft:test-text-shaping=true ../..
      - ninja -v -k0
      - ninja -v test
      - ./zigfoot --version
      - ./zigfootclient --version
      - cd ../..

      # Release (gcc)
      - mkdir -p bld/release-x64
      - cd bld/release-x64
      - meson setup --buildtype=release -Db_pgo=generate -Dgrapheme-clustering=enabled -Dfcft:grapheme-shaping=enabled -Dfcft:run-shaping=enabled  -Dfcft:test-text-shaping=true ../..
      - ninja -v -k0
      - ninja -v test
      - ./zigfoot --version
      - ./zigfootclient --version
      - cd ../..

      # Release (clang)
      - mkdir -p bld/release-x64-clang
      - cd bld/release-x64-clang
      - CC=clang meson setup --buildtype=release -Dgrapheme-clustering=enabled -Dfcft:grapheme-shaping=enabled -Dfcft:run-shaping=enabled  -Dfcft:test-text-shaping=true ../..
      - ninja -v -k0
      - ninja -v test
      - ./zigfoot --version
      - ./zigfootclient --version
      - cd ../..

      # no grapheme clustering
      - apk del harfbuzz harfbuzz-dev utf8proc utf8proc-dev
      - mkdir -p bld/debug
      - cd bld/debug
      - meson setup --buildtype=debug -Dgrapheme-clustering=disabled -Dfcft:grapheme-shaping=disabled -Dfcft:run-shaping=disabled -Dfcft:test-text-shaping=false ../..
      - ninja -v -k0
      - ninja -v test
      - ./zigfoot --version
      - ./zigfootclient --version
      - cd ../..

  - name: x86
    when:
      - event: [manual, pull_request]
      - event: [push, tag]
        branch: [master, releases/*]
    depends_on: [subprojects]
    image: i386/alpine:edge
    commands:
      - apk update
      - apk add musl-dev linux-headers meson ninja gcc clang scdoc ncurses
      - apk add libxkbcommon-dev pixman-dev freetype-dev fontconfig-dev harfbuzz-dev utf8proc-dev
      - apk add wayland-dev wayland-protocols
      - apk add git python3 zig
      # The 0.17 series is required (tested with 0.17.1).
      - test "$(zig version | cut -d. -f1,2)" = 0.17
      - apk add check-dev
      - apk add ttf-hack font-noto-emoji

      # Debug
      - mkdir -p bld/debug-x86
      - cd bld/debug-x86
      - meson setup --buildtype=debug -Dgrapheme-clustering=enabled -Dfcft:grapheme-shaping=enabled -Dfcft:run-shaping=enabled -Dfcft:test-text-shaping=true ../..
      - ninja -v -k0
      - ninja -v test
      - ./zigfoot --version
      - ./zigfootclient --version
      - cd ../..

      # Release (gcc)
      - mkdir -p bld/release-x86
      - cd bld/release-x86
      - meson setup --buildtype=release -Db_pgo=generate -Dgrapheme-clustering=enabled -Dfcft:grapheme-shaping=enabled -Dfcft:run-shaping=enabled -Dfcft:test-text-shaping=true ../..
      - ninja -v -k0
      - ninja -v test
      - ./zigfoot --version
      - ./zigfootclient --version
      - cd ../..

      # Release (clang)
      - mkdir -p bld/release-x86-clang
      - cd bld/release-x86-clang
      - CC=clang meson setup --buildtype=release -Dgrapheme-clustering=enabled -Dfcft:grapheme-shaping=enabled -Dfcft:run-shaping=enabled -Dfcft:test-text-shaping=true ../..
      - ninja -v -k0
      - ninja -v test
      - ./zigfoot --version
      - ./zigfootclient --version
      - cd ../..

  - name: zig
    when:
      - event: [manual, pull_request]
      - event: [push, tag]
        branch: [master, releases/*]
    depends_on: [subprojects]
    image: alpine:edge
    commands:
      - apk update
      - apk add musl-dev linux-headers meson ninja gcc clang scdoc ncurses
      - apk add libxkbcommon-dev pixman-dev freetype-dev fontconfig-dev harfbuzz-dev utf8proc-dev
      - apk add wayland-dev wayland-protocols
      - apk add git python3 zig weston ttf-hack font-noto-emoji

      - zig version
      # compile_zig.py enforces the 0.17 series (tested with 0.17.1).
      - test "$(zig version | cut -d. -f1,2)" = 0.17
      - |
        for cfg in enabled disabled; do
          dir=bld/zig-$cfg
          meson setup "$dir" --buildtype=debug -Dgrapheme-clustering=$cfg
          ninja -v -C "$dir"
          meson test -C "$dir" --print-errorlogs
          ./"$dir"/zigfoot --version
          scripts/smoke.sh ./"$dir"/zigfoot
          scripts/check-targets.sh
        done
      # Release mode must build and pass the same tests.
      # `ime` is a boolean option and meson refuses `false` (the Zig wayland.h
      # mirrors assume IME support), so the release job keeps it on.
      - meson setup bld/zig-release --buildtype=release -Dgrapheme-clustering=enabled -Dime=true
      - ninja -v -C bld/zig-release
      - meson test -C bld/zig-release --print-errorlogs
      - ./bld/zig-release/zigfoot --version
